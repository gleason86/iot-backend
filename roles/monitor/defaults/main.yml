---
# Accepted continuity-monitor InfluxDB read path(s). These feed the systemd
# unit's IPAddressAllow sandbox rule (continuity-monitor.service.j2). Keep
# this list in sync with the ALLOWED_URLS tuple hardcoded in
# scripts/continuity-monitor.py -- that tuple is intentionally fixed in code
# (not read from this file) so a config.json typo cannot point the read-only
# monitor at an unreviewed host; this variable only widens/narrows the kernel
# network sandbox to match whichever of those reviewed addresses is in use.
monitor_endpoint_hosts:
  - 10.77.77.1      # direct cable path; confirmed reachable (200) from Threadripper, default deployment target
  - 192.168.1.100   # legacy Wi-Fi path; unreachable from Threadripper as of 2026-09-15/16, kept allowed for rollback

# Documented intended value for the out-of-repo config.json 'url' field
# (copied from monitor_config_source, an opaque secrets file holding the
# read-only token). This role never reads or writes that file's contents --
# it is not templated here -- so this variable does not itself change the
# deployed config.json. Whoever maintains monitor_config_source must set its
# 'url' field to this same address; it must be a member of ALLOWED_URLS in
# scripts/continuity-monitor.py or the monitor will exit 1 with
# "Unreviewed endpoint".
monitor_url: http://10.77.77.1:8086
