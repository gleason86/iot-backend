# Native Telegraf host collector for the Ryzen (household observability M3 pilot,
# 2026-09-16). Deployed by install-telegraf.ps1 to C:\ProgramData\telegraf\telegraf.conf
# and run by the Windows service "telegraf" as the virtual account NT SERVICE\telegraf
# (no docker-users membership: the Docker container input is omitted, D11).
#
# This file holds NO output and NO secret. The [[outputs.influxdb_v2]] stanza lives
# in C:\ProgramData\telegraf\telegraf.d\influxdb-output.conf (see
# telegraf.d\influxdb-output.conf.example): a Telegraf array-of-tables fragment must
# carry the whole plugin instance, a token-only fragment would create a second,
# url-less output instead of merging. That file is ACL-restricted to SYSTEM,
# Administrators and NT SERVICE\telegraf (read). Do not edit iot-backend\telegraf\
# telegraf.conf (the container collector) for host telemetry.
#
# Every row carries host=ryzen observer=ryzen (CONTRACT.md "Global tags"); the
# agent's own hostname tag is omitted so the global tag is the only host tag.

[global_tags]
  host = "ryzen"
  observer = "ryzen"

[agent]
  interval = "60s"
  round_interval = true
  metric_batch_size = 1000
  # In-memory only: unsent metrics beyond this limit are dropped oldest-first and
  # counted in internal_write.metrics_dropped. Not durable across restarts.
  metric_buffer_limit = 10000
  collection_jitter = "5s"
  flush_interval = "30s"
  flush_jitter = "5s"
  precision = "0s"
  skip_processors_after_aggregators = true
  omit_hostname = true
  debug = false
  quiet = false
  logformat = "text"
  # The virtual account has no Event Log write grant: log to a file it owns.
  logtarget = "file"
  logfile = 'C:\ProgramData\telegraf\logs\telegraf.log'
  logfile_rotation_max_size = "10MB"
  logfile_rotation_max_archives = 3

# ---------------------------------------------------------------- host metrics

[[inputs.win_perf_counters]]
  UseWildcardsExpansion = false
  PrintValid = false

  [[inputs.win_perf_counters.object]]
    ObjectName = "Processor"
    Instances = ["*"]
    Counters = ["% Idle Time", "% Interrupt Time", "% Privileged Time", "% User Time", "% Processor Time"]
    Measurement = "win_cpu"
    IncludeTotal = true

  [[inputs.win_perf_counters.object]]
    ObjectName = "Memory"
    Instances = ["------"]
    Counters = ["Available Bytes", "Cache Faults/sec", "Demand Zero Faults/sec", "Page Faults/sec", "Pages/sec", "Transition Faults/sec", "Pool Nonpaged Bytes", "Pool Paged Bytes", "Committed Bytes", "Standby Cache Reserve Bytes", "Standby Cache Normal Priority Bytes", "Standby Cache Core Bytes"]
    Measurement = "win_mem"

  [[inputs.win_perf_counters.object]]
    ObjectName = "LogicalDisk"
    Instances = ["*"]
    Counters = ["% Idle Time", "% Disk Time", "% Disk Read Time", "% Disk Write Time", "Current Disk Queue Length", "% Free Space", "Free Megabytes", "Disk Read Bytes/sec", "Disk Write Bytes/sec", "Avg. Disk sec/Read", "Avg. Disk sec/Write"]
    Measurement = "win_disk"
    IncludeTotal = false

  [[inputs.win_perf_counters.object]]
    ObjectName = "Network Interface"
    Instances = ["*"]
    Counters = ["Bytes Received/sec", "Bytes Sent/sec", "Packets Received/sec", "Packets Sent/sec", "Packets Received Discarded", "Packets Received Errors", "Packets Outbound Discarded", "Packets Outbound Errors"]
    Measurement = "win_net"

  [[inputs.win_perf_counters.object]]
    ObjectName = "System"
    Instances = ["------"]
    Counters = ["Context Switches/sec", "System Calls/sec", "Processor Queue Length", "System Up Time"]
    Measurement = "win_system"

# Cross-platform views (gopsutil) alongside the counters.
[[inputs.mem]]

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs"]

[[inputs.system]]
  include = ["load", "uptime", "cpus"]

[[inputs.internal]]
  collect_memstats = true
  collect_gostats = false
  per_instance = false

# Windows services: com.docker.service is the Docker Desktop backend service and
# stays Stopped/Manual on this host while the Engine runs under the user's
# Docker Desktop session (verified 2026-09-16: Stopped while docker 29.8.0 answered),
# so "Stopped" is NOT evidence that Docker is down here. Alloy and telegraf are
# listed ahead of their installs (a missing service logs an error, no row).
[[inputs.win_services]]
  service_names = ["com.docker.service", "Alloy", "telegraf", "W32Time"]

# ---------------------------------------------------------------- exec (NT SERVICE\telegraf)

# service_health / service_check / service_dependency from the PowerShell port of
# the evaluator, manifest C:\Users\david\Repos\iot-backend\config\monitoring\
# dependencies.json (the account needs Read on that directory: install step).
# Probes run sequentially; the timeout must exceed the manifest budget (20 s).
[[inputs.exec]]
  commands = ['powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\ProgramData\telegraf\exec\service-health.ps1"']
  timeout = "50s"
  data_format = "influx"

# logging_state,fw=winfw,profile=<domain|private|public> from Get-NetFirewallProfile;
# audit_logon/audit_logoff stay "unknown (needs elevation)" for this identity.
[[inputs.exec]]
  commands = ['powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\ProgramData\telegraf\exec\logging-state.ps1"']
  timeout = "30s"
  data_format = "influx"

# source_progress,source=<winfw|winsec|winsys|winlsm|winrcm|winrdpcore|winfwpolicy>:
# Alloy positions.yml / bookmark.xml vs pfirewall.log size / newest RecordId.
# winsec stays unknown until NT SERVICE\telegraf is in Event Log Readers.
[[inputs.exec]]
  commands = ['powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\ProgramData\telegraf\exec\source-progress.ps1"']
  timeout = "30s"
  data_format = "influx"

# host_session,session_id=<id> from quser.
[[inputs.exec]]
  commands = ['powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\ProgramData\telegraf\exec\host-session.ps1"']
  timeout = "30s"
  data_format = "influx"

# clock_offset from w32tm /query /status /verbose.
[[inputs.exec]]
  commands = ['powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\ProgramData\telegraf\exec\clock-offset.ps1"']
  timeout = "30s"
  data_format = "influx"

# ---------------------------------------------------------------- Alloy self-metrics

# Alloy v1.19.2 (log-collector worker, iot-backend/host/alloy) on loopback.
# metric_version = 1: measurement = metric name, tags = labels (+ collector=alloy,
# host, observer); the url tag is dropped to match CONTRACT.md. Until Alloy is
# installed this input logs a connection error every interval and produces no rows.
[[inputs.prometheus]]
  urls = ["http://127.0.0.1:12345/metrics"]
  metric_version = 1
  response_timeout = "5s"
  tagexclude = ["url"]
  [inputs.prometheus.tags]
    collector = "alloy"
