# IoT backend on the Ryzen PC (192.168.1.100, static).
# Manage with `docker compose up -d` from this directory; secrets come from ./.env.
#
# 2026-08-31: voice-assistant stack (gateway, engines, UI, ChromaDB, HA-MCP bridge,
# Prometheus) removed — project parked, resources reclaimed. See CHANGELOG.

# Every service gets rotated JSON logs. An unrotated voice-gateway log grew to
# 1.04 TB and filled the Docker VM disk in Jan 2026 — never run without this.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # =========================================================================
  # MQTT Broker
  # =========================================================================
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: iot-mosquitto
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/password.txt:/mosquitto/config/password.txt:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - iot-network

  # =========================================================================
  # Time-Series Database (also the target of Home Assistant's influxdb: block)
  # =========================================================================
  influxdb:
    image: influxdb:2
    container_name: iot-influxdb
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_ADMIN_USER}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_ADMIN_TOKEN}
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    networks:
      - iot-network

  # =========================================================================
  # Data Pipeline (MQTT -> InfluxDB)
  # =========================================================================
  telegraf:
    image: telegraf:1.29
    container_name: iot-telegraf
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - mosquitto
      - influxdb
    environment:
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - INFLUXDB_TOKEN=${INFLUXDB_TELEGRAF_TOKEN:?set INFLUXDB_TELEGRAF_TOKEN in .env (write-only Influx token for Telegraf)}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    networks:
      - iot-network

  # =========================================================================
  # Visualization
  # =========================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: iot-grafana
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - influxdb
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - INFLUXDB_READ_TOKEN=${INFLUXDB_READ_TOKEN:?set INFLUXDB_READ_TOKEN in .env (read-only Influx token for Grafana)}
      # No GF_INSTALL_PLUGINS: a failed plugin download/extract aborts Grafana
      # startup, and no provisioned dashboard uses one.
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - iot-network

networks:
  iot-network:
    driver: bridge

volumes:
  mosquitto_data:
  mosquitto_log:
  influxdb_data:
  influxdb_config:
  grafana_data:
